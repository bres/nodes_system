{% extends 'inventory/base.html' %}
{% block content %}
    <!-- Record details card -->
    <div class="container py-4">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <h3 class="mb-1">{{ object }}</h3>
                        <p class="text-muted mb-0">{{ model_name }}</p>
                    </div>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-2">
                        {{ app_label }}.{{ model_name_slug }}
                    </span>
                </div>
                <!-- Detail fields -->
                <div class="row g-3">
                    {% for field_name, field_value in field_data %}
                        <div class="col-md-6">
                            <div class="border rounded-3 p-3 h-100 bg-light">
                                <div class="text-muted small mb-1">{{ field_name }}</div>
                                <div class="fw-semibold text-dark">{{ field_value }}</div>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
{% endblock %}
